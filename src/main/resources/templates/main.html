<!doctype html>
<html lang="ko" translate="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{_fragments/_head :: my-head('Movie Review')}" />

    <style>
        .card {
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .movie-poster {
            height: 400px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-dark text-white">

    <th:block th:replace="~{_fragments/header :: my-header}" />

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">🎬 인기 영화</h3>
            <form method="get" th:action="@{/{movieGbn}(movieGbn=${movieGbn})}"  class="d-flex col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3">
                <input type="search" name="keyword" class="form-control form-control-dark" style="width: 180px;" th:value="${keyword}" placeholder="Search..." aria-label="Search">
                <button type="submit" class="btn btn-warning fw-bold">검색</button>
            </form>
        </div>

        <div class="row g-4">

            <div class="col-6 col-md-4 col-lg-3"
                 th:each="movie : ${movieList}">

                <div class="card bg-dark text-white border border-secondary h-100 shadow">

                    <a th:href="@{/movie/{movieGbn}/detail/{id}(movieGbn=${movieGbn}, id=${movie.movieId})}">
                        <img th:src="${movie.poster != 'N/A' ? movie.poster : 'https://via.placeholder.com/300x450?text=No+Image'}"
                            class="card-img-top rounded-top movie-poster"  alt="영화 포스터">
                    </a>

                    <div class="card-body d-flex flex-column" >

                        <h6 class="card-title fw-bold"
                            th:text="${movie.title}">
                            영화 제목
                        </h6>

                        <p class="card-text small text-secondary mb-3">
                            개봉년도 :
                            <span th:text="${movie.year}">2024</span>
                        </p>

                        <div class="mt-auto d-flex justify-content-between align-items-center">
                            <span class="badge bg-warning text-dark" th:text="${movie.type}">
                                movie
                            </span>

                            <a th:href="@{/movie/{movieGbn}/detail/{id}(movieGbn=${movieGbn}, id=${movie.movieId})}" class="btn btn-sm btn-outline-light">
                                상세보기
                            </a>
                        </div>

                    </div>
                </div>
            </div>

        </div>

        <div class="text-center mt-5"
             th:if="${movieList == null or #lists.isEmpty(movieList)}">

            <h5 class="text-secondary">검색 결과가 없습니다.</h5>

        </div>

    </div>

    <th:block th:replace="~{_fragments/footer :: my-footer}" />
    <th:block th:replace="~{_fragments/_scripts :: my-scripts}" />

</body>
</html>
