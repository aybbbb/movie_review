<!doctype html>
<html lang="ko" translate="no" xmlns:th="http://www.thymeleaf.org" >
    <head>
        <th:block th:replace="~{_fragments/_head :: my-head('Movie Review')}" />
    </head>
    <body class="bg-dark text-white">
        <th:block th:replace="~{_fragments/header :: my-header}" />

        <div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    
            <form id="reset-password-form" class="w-100" style="max-width: 420px;">
                
                <div class="bg-secondary p-4 rounded-4 shadow">

                    <!-- 타이틀 -->
                    <p class="fs-4 text-center mb-4 fw-bold">비밀번호 재발급</p>

                    <!-- 안내 -->
                    <p class="text-center small text-light mb-4">
                        가입 시 입력한 아이디와 이메일을 입력해주세요.
                    </p>

                    <!-- 이름 -->
                    <div class="mb-3">
                        <label class="form-label">아이디</label>
                        <input type="text" class="form-control" 
                            id="user_id" name="user_id" placeholder="아이디">
                    </div>

                    <!-- 이메일 -->
                    <div class="mb-4">
                        <label class="form-label">이메일</label>
                        <input type="email" class="form-control" 
                            id="email" name="email" placeholder="이메일">
                    </div>

                    <!-- 버튼 -->
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">
                        비밀번호 재발급
                    </button>

                    <!-- 구분선 -->
                    <hr class="my-4">

                    <!-- 하단 링크 -->
                    <div class="text-center small">
                        <p class="mb-2">
                            계정이 없으신가요? 
                            <a th:href="@{/account/join}" class="text-warning">회원가입</a>
                        </p>
                        <p class="mb-0">
                            로그인이 필요하신가요?
                            <a th:href="@{/account/login}" class="text-warning">로그인</a>
                        </p>
                    </div>

                </div>
            </form>

        </div>

        <th:block th:replace="~{_fragments/footer :: my-footer}" />
        <th:block th:replace="~{_fragments/_scripts :: my-scripts}" />
        <script>
            document.querySelector("#reset-password-form").addEventListener("submit", async(e)=>{
                e.preventDefault();

                try {
                    regexHelper.value("#user_id", "아이디를 입력하세요.");
                    regexHelper.value("#email", "이메일 주소를 입력하세요.");
                } catch (error) {
                    alert(error.message);
                    return;
                }

                let json = null;

                try {
                    json = await fetchHelper.post("[[@{/api/account/find_pw}]]", new FormData(e.currentTarget));
                } catch (error) {
                    alert(error.message);
                    return;
                }
                

                const email = document.querySelector("#email").value;
                alert(`변경된 비밀번호를 ${email}로 보내드렸습니다. 메일을 확인해주세요.`);
                window.location ="[[@{/}]]";
            });
        </script>
    </body>
</html>
