<!doctype html>
<html lang="ko" translate="no" xmlns:th="http://www.thymeleaf.org" >
    <head>
        <th:block th:replace="~{_fragments/_head :: my-head('Movie Review')}" />
    </head>
    <body class="bg-dark text-white">
        <th:block th:replace="~{_fragments/header :: my-header}" />
        <div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">

            <form id="signup-form" class="w-100" style="max-width: 480px;">

                <div class="bg-secondary p-4 rounded-4 shadow">

                    <!-- 타이틀 -->
                    <p class="fs-4 text-center mb-4 fw-bold">회원정보 수정</p>

                    <!-- 아이디 -->
                    <div class="mb-3">
                        <label class="form-label">아이디</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="user_id" name="user_id" th:value="${session.memberInfo.userId}" disabled placeholder="아이디">
                        </div>
                    </div>

                    <!-- 비밀번호 -->
                    <div class="mb-3">
                        <label class="form-label">현재 비밀번호</label>
                        <input type="password" class="form-control" id="user_pw" name="user_pw" placeholder="비밀번호">
                    </div>

                    <!-- 비밀번호 확인 -->
                    <div class="mb-3">
                        <label class="form-label">새로운 비밀번호</label>
                        <input type="password" class="form-control" id="new_user_pw" name="new_user_pw" placeholder="새로운 비밀번호">
                        <span class="fs-7">변경을 원하실때만 입력해주세요.</span>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">새로운 비밀번호 확인</label>
                        <input type="password" class="form-control" id="new_user_pw_confirm" name="new_user_pw_confirm" placeholder="새로운 비밀번호 확인">
                    </div>


                    <!-- 이름 -->
                    <div class="mb-3">
                        <label class="form-label">이름</label>
                        <input type="text" class="form-control" id="user_name" name="user_name" th:value="${session.memberInfo.userName}" placeholder="이름">
                    </div>

                    <!-- 이메일 -->
                    <div class="mb-3">
                        <label class="form-label">이메일</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="email" name="email" th:value="${session.memberInfo.email}" placeholder="이메일">
                            <button type="button" class="btn btn-outline-light" id="email_unique_check">
                                중복검사
                            </button>
                        </div>
                        <input type="hidden" id="email_check" name="email_check" value="N"/>
                    </div>

                    <!-- 전화번호 -->
                    <div class="mb-4">
                        <label class="form-label">전화번호</label>
                        <input type="tel" class="form-control" id="phone" name="phone" th:value="${session.memberInfo.phone.replace('-','')}" placeholder="전화번호">
                    </div>

                    <!-- 버튼 -->
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">
                        회원정보 수정
                    </button>

                    <!-- 구분선 -->
                    <hr class="my-4">

                    <!-- 하단 링크 -->
                    <div class="text-center small">
                        <p class="mb-0">
                            <a class="dropdown-item" th:href="@{/account/out}">탈퇴</a>
                        </p>
                    </div>

                </div>

            </form>
        </div>

        <th:block th:replace="~{_fragments/footer :: my-footer}" />
        <th:block th:replace="~{_fragments/_scripts :: my-scripts}" />
        <script>

            document.querySelector("#email_unique_check").addEventListener("click", async(e)=>{
                e.preventDefault();
                try {
                    regexHelper.value("#email", "이메일를 입력하세요.");
                    regexHelper.email("#email","이메일 형식이 맞지 않습니다.");
                } catch (error) {
                    alert(error.message);
                    e.element.focus();
                    return;
                }

                try {
                    await fetchHelper.get('[[@{/api/account/email_unique_check}]]', {
                        email : document.querySelector("#email").value
                    });
                } catch (error) {
                    console.error(error);
                    alert(error.message);
                    return;
                }

                alert("사용 가능한 이메일 입니다.");
                document.querySelector("#email_check").value ="Y"
            });

            document.querySelector("#email").addEventListener("change", e=>{
                document.querySelector("#email_check").value ="N";
            });

            /** 회원가입 폼 제출 이벤트 */
        document.getElementById("signup-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            /** 입력값 유효성 검사 */
            try {
                // 현재 비밀번호에 대한 입력 여부 확인
                regexHelper.value("#user_pw", "현재 비밀번호를 입력하세요");

                // 변경할 비밀번호와 변경할 비밀번호의 확인값
                const newUserPw = document.querySelector("#new_user_pw").value;
                const newUserPwConfirm = document.querySelector("#new_user_pw_confirm").value;

                // 새로운 비밀번호가 입력되었을 때만 확인값 검사
                if (newUserPw || newUserPwConfirm) {
                    regexHelper.compareTo("#new_user_pw", "#new_user_pw_confirm", "비밀번호 확인이 잘못되었습니다.");
                }

                regexHelper.value("#user_name", "이름을 입력하세요");
                regexHelper.kor("#user_name", "이름은 한글로만 입력할 수 있습니다.");
                regexHelper.maxLength("#user_name", 20, "아이디는 2자 이상 20자 이하로 입력하세요");
                regexHelper.minLength("#user_name", 2, "아이디는 2자 이상 20자 이하로 입력하세요");

                regexHelper.value("#email", "이메일 주소를 입력하세요");
                regexHelper.email("#email", "이메일 주소가 잘못되었습니다.");

                regexHelper.value("#phone", "전화번호를 입력하세요.");
                regexHelper.phone("#phone", "전화번호 형식이 잘못되었습니다.");

               
                
            } catch (e) {
                alert(e.message);
                e.element.focus()
                return;
            }

            const emailCheck = document.querySelector("#email_check").value;

            if (emailCheck === "N") {
                alert("이메일 중복 검사를 진행해주세요.");
                document.querySelector("#email_unique_check").focus();
                return;
            }

            // <form>태그 내의 모든 요소를 Ajax 요청이 가능한 상태로 변환
            const formData = new FormData(e.currentTarget);

            // Ajax 요청 --> 백엔드에 가입 요청함
            try {
                data = await fetchHelper.put("[[@{/api/account/edit}]]", formData);
            } catch (e) {
                console.log(e);
                alert(e.message);
                return;
            }

            window.location ='[[@{/}]]';
        });
        </script>
    </body>
</html>
