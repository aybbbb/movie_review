<!doctype html>
<html lang="ko" translate="no" xmlns:th="http://www.thymeleaf.org" >
    <head>
        <th:block th:replace="~{_fragments/_head :: my-head('Movie Review')}" />
    </head>
    <body class="bg-dark text-white">
        <th:block th:replace="~{_fragments/header :: my-header}" />
        <div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">

            <form id="signup-form" class="w-100" style="max-width: 480px;">

                <div class="bg-secondary p-4 rounded-4 shadow">

                    <!-- 타이틀 -->
                    <p class="fs-4 text-center mb-4 fw-bold">회원가입</p>

                    <!-- 아이디 -->
                    <div class="mb-3">
                        <label class="form-label">아이디</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="user_id" name="user_id" placeholder="아이디">
                            <button type="button" class="btn btn-outline-light" id="id_unique_check">
                                중복검사
                            </button>
                        </div>
                        <input type="hidden" id="id_check" name="id_check" value="N"/>
                    </div>

                    <!-- 비밀번호 -->
                    <div class="mb-3">
                        <label class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="user_pw" name="user_pw" placeholder="비밀번호">
                    </div>

                    <!-- 비밀번호 확인 -->
                    <div class="mb-3">
                        <label class="form-label">비밀번호 확인</label>
                        <input type="password" class="form-control" id="user_pw_re" name="user_pw_re" placeholder="비밀번호 확인">
                    </div>

                    <!-- 이름 -->
                    <div class="mb-3">
                        <label class="form-label">이름</label>
                        <input type="text" class="form-control" id="user_name" name="user_name" placeholder="이름">
                    </div>

                    <!-- 이메일 -->
                    <div class="mb-3">
                        <label class="form-label">이메일</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="email" name="email" placeholder="이메일">
                            <button type="button" class="btn btn-outline-light" id="email_unique_check">
                                중복검사
                            </button>
                        </div>
                        <input type="hidden" id="email_check" name="email_check" value="N"/>
                    </div>

                    <!-- 전화번호 -->
                    <div class="mb-4">
                        <label class="form-label">전화번호</label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="전화번호">
                    </div>

                    <!-- 버튼 -->
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">
                        회원가입
                    </button>

                    <!-- 구분선 -->
                    <hr class="my-4">

                    <!-- 하단 링크 -->
                    <div class="text-center small">
                        <p class="mb-0">
                            이미 계정이 있으신가요?
                            <a th:href="@{/account/login}" class="text-warning">로그인</a>
                        </p>
                    </div>

                </div>

            </form>
        </div>

        <th:block th:replace="~{_fragments/footer :: my-footer}" />
        <th:block th:replace="~{_fragments/_scripts :: my-scripts}" />
        <script>
        

            document.querySelector("#id_unique_check").addEventListener("click", async(e)=>{
                e.preventDefault();
                try {
                    regexHelper.value("#user_id", "아이디를 입력하세요.");
                    regexHelper.engNum("#user_id","아이디는 영문자와 숫자만 가능합니다.");
                } catch (error) {
                    alert(error.message);
                    e.element.focus();
                    return;
                }

                try {
                    await fetchHelper.get('[[@{/api/account/id_unique_check}]]', {
                        user_id : document.querySelector("#user_id").value
                    });
                } catch (error) {
                    console.error(error);
                    alert(error.message);
                    return;
                }

                alert("사용 가능한 아이디 입니다.");
                document.querySelector("#id_check").value ="Y"
            });

            document.querySelector("#user_id").addEventListener("change", e=>{
                document.querySelector("#id_check").value ="N";
            })

            document.querySelector("#email_unique_check").addEventListener("click", async(e)=>{
                e.preventDefault();
                try {
                    regexHelper.value("#email", "이메일를 입력하세요.");
                    regexHelper.email("#email","이메일 형식이 맞지 않습니다.");
                } catch (error) {
                    alert(error.message);
                    e.element.focus();
                    return;
                }

                try {
                    await fetchHelper.get('[[@{/api/account/email_unique_check}]]', {
                        email : document.querySelector("#email").value
                    });
                } catch (error) {
                    console.error(error);
                    alert(error.message);
                    return;
                }

                alert("사용 가능한 이메일 입니다.");
                document.querySelector("#email_check").value ="Y"
            });

            document.querySelector("#email").addEventListener("change", e=>{
                document.querySelector("#email_check").value ="N";
            });

            /** 회원가입 폼 제출 이벤트 */
        document.getElementById("signup-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            /** 입력값 유효성 검사 */
            try {
                regexHelper.value("#user_id", "아이디를 입력하세요");
                regexHelper.maxLength("#user_id", 20, "아이디는 4자 이상 20자 이하로 입력하세요");
                regexHelper.minLength("#user_id", 4, "아이디는 4자 이상 20자 이하로 입력하세요");
                regexHelper.engNum("#user_id", "아이디는 영어와 숫자로만 입력 가능합니다.");

                regexHelper.value("#user_pw", "비밀번호를 입력하세요");
                regexHelper.maxLength("#user_pw", 20, "아이디는 4자 이상 20자 이하로 입력하세요");
                regexHelper.minLength("#user_pw", 4, "아이디는 4자 이상 20자 이하로 입력하세요");
                regexHelper.compareTo("#user_pw", "#user_pw_re", "비밀번호 확인이 잘못되었습니다.");

                regexHelper.value("#user_name", "이름을 입력하세요");
                regexHelper.kor("#user_name", "이름은 한글로만 입력할 수 있습니다.");
                regexHelper.maxLength("#user_name", 20, "아이디는 2자 이상 20자 이하로 입력하세요");
                regexHelper.minLength("#user_name", 2, "아이디는 2자 이상 20자 이하로 입력하세요");

                regexHelper.value("#email", "이메일 주소를 입력하세요");
                regexHelper.email("#email", "이메일 주소가 잘못되었습니다.");

                regexHelper.value("#phone", "전화번호를 입력하세요.");
                regexHelper.phone("#phone", "전화번호 형식이 잘못되었습니다.");

                
            } catch (e) {
                alert(e.message);
                e.element.focus()
                return;
            }

            // 아이디와 이메일 중복검사 여부 확인
            const idCheck = document.querySelector("#id_check").value;
            const emailCheck = document.querySelector("#email_check").value;

            if (idCheck === "N") {
                alert("아이디 중복 검사를 진행해주세요.");
                document.querySelector("#id_unique_check").focus();
                return;
            }

            if (emailCheck === "N") {
                alert("이메일 중복 검사를 진행해주세요.");
                document.querySelector("#email_unique_check").focus();
                return;
            }

            // <form>태그 내의 모든 요소를 Ajax 요청이 가능한 상태로 변환
            const formData = new FormData(e.currentTarget);

            // Ajax 요청 --> 백엔드에 가입 요청함
            try {
                data = await fetchHelper.post("[[@{/api/account/join}]]", formData);
            } catch (e) {
                console.log(e);
                alert(e.message);
                return;
            }

            // 회원가입 성공 후 결과 페이지로 이동
            window.location = "[[@{/account/join_result}]]";
        });
        </script>
    </body>
</html>
