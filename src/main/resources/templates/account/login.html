<!doctype html>
<html lang="ko" translate="no" xmlns:th="http://www.thymeleaf.org" >
    <head>
        <th:block th:replace="~{_fragments/_head :: my-head('Movie Review')}" />
    </head>
    <body class="bg-dark text-white">
        <th:block th:replace="~{_fragments/header :: my-header}" />

        <div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    
            <form id="login-form" class="w-100" style="max-width: 420px;">
                <input type="hidden" id="redirect" name="redirect" th:value="${param.redirect}">
                <div class="bg-secondary p-4 rounded-4 shadow">

                    <!-- 타이틀 -->
                    <p class="fs-4 text-center mb-4 fw-bold">로그인</p>

                    <!-- 아이디 -->
                    <div class="mb-3">
                        <label class="form-label">아이디</label>
                        <input type="text" class="form-control" id="user_id" name="user_id" placeholder="아이디">
                    </div>

                    <!-- 비밀번호 -->
                    <div class="mb-4">
                        <label class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="user_pw" name="user_pw" placeholder="비밀번호">
                    </div>

                    <!-- 버튼 -->
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">
                        로그인
                    </button>

                    <!-- 구분선 -->
                    <hr class="my-4">

                    <!-- 하단 링크 -->
                    <div class="text-center small">
                        <p class="mb-2">
                            계정이 없으신가요? 
                            <a th:href="@{/account/join}" class="text-warning">회원가입</a>
                        </p>

                        <p class="mb-1">
                            <a th:href="@{/account/find_id}" class="text-decoration-none text-light">
                                아이디 찾기
                            </a>
                            <span class="mx-2 text-secondary">|</span>
                            <a th:href="@{/account/find_pw}" class="text-decoration-none text-light">
                                비밀번호 재발급
                            </a>
                        </p>
                    </div>

                </div>
            </form>

        </div>

        <th:block th:replace="~{_fragments/footer :: my-footer}" />
        <th:block th:replace="~{_fragments/_scripts :: my-scripts}" />
        <script>
            document.querySelector("#login-form").addEventListener("submit", async(e)=>{
                e.preventDefault();

                try {
                    regexHelper.value("#user_id", "아이디를 입력하세요.");
                    regexHelper.value("#user_pw", "비밀번호를 입력하세요.");
                } catch (error) {
                    alert(error.message);
                    error.element.focus();
                    return;
                }

                try {
                    await fetchHelper.post("[[@{/api/account/login}]]", new FormData(e.currentTarget));
                } catch (error) {
                    alert(error.message);
                    error.element.focus();
                    return;
                }

                const redirect = document.querySelector("#redirect").value;

                if (redirect) {
                    window.location = redirect;
                } else {
                    window.location = "[[@{/}]]";
                }
            })
        </script>
    </body>
</html>
