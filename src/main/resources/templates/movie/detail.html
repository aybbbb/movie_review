<!doctype html>
<html lang="ko" translate="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{_fragments/_head :: my-head(${movie.title})}" />

    <style>
    .star {
        cursor: pointer;
        transition: 0.2s;
    }

    .star:hover {
        transform: scale(1.2);
    }
    </style>
</head>
<body class="bg-dark text-white">

    <th:block th:replace="~{_fragments/header :: my-header}" />

    <div class="container py-5">

        <div class="row g-5">

            <!-- 포스터 -->
            <div class="col-md-4">
                <img th:src="${movie.poster != 'N/A' ? movie.poster : 'https://via.placeholder.com/400x600?text=No+Image'}"
                     class="movie-poster shadow" style="max-height: 600px; width: 100%; object-fit: cover;" alt="영화 포스터">
            </div>

            <!-- 영화 정보 -->
            <div class="col-md-8">

                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <h2 class="fw-bold mb-2" th:text="${movie.title}">영화 제목</h2>

                        <p class="text-secondary mb-1">
                            <span th:text="${movie.year}">2024</span>
                            ·
                            <span th:text="${movie.runtime}">120 min</span>
                            ·
                            <span th:text="${movie.genre}">Action</span>
                        </p>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        
                        <div class="btn btn-warning rounded-pill px-3 py-2 shadow-sm d-flex align-items-center gap-2" style="cursor: default;">
                            <i class="bi bi-star-fill fs-6 text-dark"></i>
                            <span class="small fw-semibold text-dark" th:text="${ratingAvg}">8.5</span>
                        </div>

                        <!-- 위시 -->
                        <button type="button" id="wish-btn"
                                class="btn btn-dark border-secondary rounded-pill px-3 py-2 shadow-sm d-flex align-items-center gap-2">
                            <i class="bi bi-heart fs-6 text-white"></i>
                            <span class="small text-white">Wish</span>
                        </button>
                    </div>
                </div>

                <hr class="border-secondary">

                <div class="mb-3">
                    <strong>감독</strong>
                    <p class="text-secondary mb-0" th:text="${movie.director}">감독명</p>
                </div>

                <div class="mb-3">
                    <strong>배우</strong>
                    <p class="text-secondary mb-0" th:text="${movie.actors}">배우명</p>
                </div>

                <div class="mb-3">
                    <strong>개봉일</strong>
                    <p class="text-secondary mb-0" th:text="${movie.released}">01 Jan 2024</p>
                </div>

                <div class="mb-3">
                    <strong>줄거리</strong>
                    <p class="text-secondary mb-0" th:text="${movie.plot}">
                        줄거리 내용
                    </p>
                </div>

            </div>
            <div class="text-center mt-4">
                <a th:href="@{/{movieGbn}(movieGbn=${movieGbn})}"  class="btn btn-sm btn-outline-light px-4">목록가기</a>
            </div>
        </div>
       
        <!-- 리뷰 영역 -->
        <div id="review-list" class="mt-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">리뷰</h3>

                <button class="btn btn-warning" id="toggle-form">리뷰 작성</button>
            </div>

            <div th:if="${reviewList == null or #lists.isEmpty(reviewList)}"
                 class="text-center py-5 border rounded border-secondary">

                <h5 class="text-secondary">아직 등록된 리뷰가 없습니다.</h5>
            </div>
        
            <div class="col-12" th:each="review : ${reviewList}">
                <div class="card bg-secondary-subtle text-dark review-card shadow-sm border-0">
                    <div class="card-body">
                        <!-- 상단 -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <strong class="fs-6" th:text="${review.writer}">
                                작성자
                            </strong>
                            <span class="badge bg-warning text-dark fs-6 px-3 py-2">
                                ⭐ <span th:text="${review.rating}">5</span>
                            </span>
                        </div>

                        <!-- 사진 있는 리뷰 -->
                        <div th:if="${review.photoReview != null and review.photoReview != ''}">
                            <div class="row g-3 align-items-start mb-3">
                                <!-- 이미지 -->
                                <div class="col-md-4">
                                    <img th:src="@{|/files${review.photoReview}|}"
                                        class="img-fluid rounded shadow-sm border w-100"
                                        style="max-height: 220px; object-fit: contain;"
                                        alt="리뷰 인증샷">
                                </div>

                                <!-- 감상평 -->
                                <div class="col-md-8 d-flex align-items-center">
                                    <p class="mb-0 fs-6 lh-lg" th:text="${review.textReview}">
                                        리뷰 내용
                                    </p>
                                </div>

                            </div>
                        </div>

                        <!-- 사진 없는 리뷰 -->
                        <div th:if="${review.photoReview == null or review.photoReview == ''}">
                            <p class="mb-3 fs-6 lh-lg" th:text="${review.textReview}">
                                리뷰 내용
                            </p>
                        </div>

                        <!-- 하단 -->
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted" th:text="${review.regDate}">
                                2026-04-18
                            </small>
                            <!-- 본인 리뷰일 때만 노출 -->
                            <div th:if="${session.memberInfo != null and session.memberInfo.id == review.memId}">
                                <button type="button"
                                        class="btn btn-sm btn-outline-primary me-1 edit-btn"
                                        id ="btn_edit"
                                        th:data-id="${review.id}">
                                    수정
                                </button>

                                <button type="button"
                                        class="btn btn-sm btn-outline-danger delete-btn"
                                        th:data-id="${review.id}">
                                    삭제
                                </button>
                            </div>
                        </div>
                        
                        <!-- 수정 폼 -->
                        <div class="edit-form mt-3 border-top pt-3" th:id="'edit-form-' + ${review.id}" style="display:none;">

                            <form class="review-edit-form" enctype="multipart/form-data">
                                <input type="hidden" name="id" th:value="${review.id}">
                                <input type="hidden" name="movie_id" th:value="${review.movieId}">
                                <input type="hidden" name="mem_id" th:value="${review.memId}">
                                <input type="hidden" name="movie_gbn" th:value="${movieGbn}">

                                <!-- 새 사진 -->
                                <div class="mb-3">
                                    <label class="form-label">새 사진 변경</label>
                                    <input type="file" name="photo_review_upt" class="form-control"accept="image/*">
                                </div>
                                <!-- 별점 -->
                                <div class="mb-3">
                                    <div class="d-flex align-items-center gap-2">
                                        <label class="form-label mb-0">별점</label>

                                        <div class="edit-star-rating d-flex gap-1 fs-4">
                                            <span class="edit-star"
                                                th:data-review-id="${review.id}"
                                                data-value="1">☆</span>
                                            <span class="edit-star"
                                                th:data-review-id="${review.id}"
                                                data-value="2">☆</span>
                                            <span class="edit-star"
                                                th:data-review-id="${review.id}"
                                                data-value="3">☆</span>
                                            <span class="edit-star"
                                                th:data-review-id="${review.id}"
                                                data-value="4">☆</span>
                                            <span class="edit-star"
                                                th:data-review-id="${review.id}"
                                                data-value="5">☆</span>
                                        </div>
                                    </div>

                                    <input type="hidden" name="rating_upt" th:id="'edit-rating-' + ${review.id}" th:value="${review.rating}">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label">내용 수정</label>
                                    <textarea class="form-control edit-textarea" name="text_review_upt" rows="3"
                                            th:text="${review.textReview}"></textarea>

                                    <div class="d-flex justify-content-end mt-1">
                                        <small class="text-secondary">
                                            <span class="edit-char-count" th:text="${#strings.length(review.textReview)}">0</span> / 300
                                        </small>
                                    </div>
                                </div>

                               <div class="d-flex justify-content-center gap-2 mt-3">
                                    <button type="submit" class="btn btn-sm btn-warning px-4">
                                        수정
                                    </button>

                                    <button type="button" class="btn btn-sm btn-secondary cancel-edit px-4">
                                        취소
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 리뷰 작성 폼 -->
        <div id="review-form" style="display:none;" class="mt-3">

            <form id="enroll" enctype="multipart/form-data">
                <input type="hidden" name ="mem_id" th:value="${session.memberInfo != null ? session.memberInfo.id : ''}">
                <input type="hidden" name="movie_id" th:value="${movie.movieId}">
                <input type="hidden" name="movie_gbn" th:value="${movieGbn}">
                <!-- 이미지 -->
                <div class="mb-2">
                    <label class="form-label">인증샷</label>
                    <input type="file" class="form-control" id="photo_review" name="photo_review" accept="image/*">
                </div>

               <div class="mb-2 d-flex align-items-center gap-2">
                    <label class="form-label mb-0">별점</label>
                    <div id="star-rating" class="d-flex gap-1 fs-4">
                        <span class="star" data-value="1">☆</span>
                        <span class="star" data-value="2">☆</span>
                        <span class="star" data-value="3">☆</span>
                        <span class="star" data-value="4">☆</span>
                        <span class="star" data-value="5">☆</span>
                    </div>
                    <input type="hidden" id="rating" name="rating" value="0">
                </div>
                
                <div class="mb-2">
                    <label class="form-label">내용</label>
                    <textarea class="form-control" id="text_review" name="text_review"  maxlength="300"></textarea>
                    
                    <!-- 글자수 -->
                    <div class="d-flex justify-content-end mt-1">
                        <small class="text-secondary">
                            <span id="char-count">0</span> / 300
                        </small>
                    </div>
                </div>
                
                

                <!-- 작성자 -->
               <div class="d-flex justify-content-end mb-2">
                    <span class="badge bg-secondary-subtle text-dark px-3 py-2 rounded-pill shadow-sm">
                        작성자 :
                        <b th:text="${session.memberInfo != null ? session.memberInfo.userName : ''}"></b>
                    </span>
                </div>

                <button type="submit" class="btn btn-warning w-100">
                    등록
                </button>

            </form>

        </div>

    </div>

    <th:block th:replace="~{_fragments/footer :: my-footer}" />
    <th:block th:replace="~{_fragments/_scripts :: my-scripts}" />
    <script th:inline="javascript">
        const MAX = 300;

        const textarea = document.querySelector("#text_review");
        const counter = document.querySelector("#char-count");

        const stars = document.querySelectorAll(".star");
        const ratingInput = document.querySelector("#rating");

        const toggleFormBtn = document.querySelector("#toggle-form");
        const wishBtn = document.querySelector("#wish-btn");
        const enrollForm = document.querySelector("#enroll");

        const movieId = /*[[${movie.movieId}]]*/ "";
        const movieGbn = /*[[${movieGbn}]]*/ "";
        const isLogin = /*[[${session.memberInfo != null}]]*/ false;

        let isWished = false;

        // Init
        document.addEventListener("DOMContentLoaded", async () => {
            initReviewTextarea();
            initStarRating();
            initReviewForm();
            initWishlist();
            initEditButtons();
            initEditTextareas();
            initEditStars();
            initEditForms();
            initCancelButtons();
            initDeleteButtons();

            await loadWishlistStatus();
        });

        //공통함수

        // 로그인
        function redirectToLogin() {
            const currentUrl = window.location.pathname + window.location.search;

            if (confirm("로그인이 필요합니다. 로그인 하시겠습니까?")) {
                window.location = "/account/login?redirect=" + encodeURIComponent(currentUrl);
            }
        }

        function requireLogin() {
            if (!isLogin) {
                redirectToLogin();
                return false;
            }
            return true;
        }

        // 글자 제한
        function limitText(textareaElement, counterElement) {
            let value = textareaElement.value;

            if (value.length > MAX) {
                alert("300자 이하로 작성해주세요.");
                textareaElement.value = value.substring(0, MAX);
                value = textareaElement.value;
            }

            if (counterElement) {
                counterElement.innerText = value.length;
            }
        }

        // 별그리기
        function paintStars(starElements, value) {
            starElements.forEach(star => {
                if (Number(star.dataset.value) <= Number(value)) {
                    star.textContent = "★";
                    star.style.color = "#ffc107";
                } else {
                    star.textContent = "☆";
                    star.style.color = "#ccc";
                }
            });
        }

        // 수정폼 제어
        function hideAllEditForms() {
            document.querySelectorAll(".edit-form").forEach(form => {
                form.style.display = "none";
            });
        }

        // 리뷰리스트 제어
        function hideReviewList() {
            const reviewList = document.querySelector("#review-list");
            if (reviewList) {
                reviewList.style.display = "none";
            }
        }

        // 수정버튼 없애기
        function hideEditButton() {
            const btnEdit = document.querySelector("#btn_edit");
            if (btnEdit) {
                btnEdit.style.display = "none";
            }
        }

        // 수정폼
        function showEditForm(reviewId) {
            const targetForm = document.querySelector("#edit-form-" + reviewId);
            if (!targetForm) return;

            hideAllEditForms();
            targetForm.style.display = "block";
            hideEditButton();

            // 별점 표시
            const starValue = document.querySelector("#edit-rating-" + reviewId)?.value || 0;

            const editStars = document.querySelectorAll('.edit-star[data-review-id="' + reviewId + '"]');

            paintStars(editStars, starValue);

            // 글자수 표시
            const editTextarea = targetForm.querySelector(".edit-textarea");
            const editCounter = targetForm.querySelector(".edit-char-count");

            if (editTextarea && editCounter) {
                editCounter.innerText = editTextarea.value.length;
            }

            targetForm.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        // 위시리스트
        async function loadWishlistStatus() {
            if (!wishBtn) return;

            try {
                const result = await fetchHelper.get(`/api/wishlist/is_wished?movie_id=${movieId}&movie_gbn=${movieGbn}`);

                isWished = result.isWished;
                setWishButton();
            } catch (error) {
                console.error(error);
            }
        }

        function setWishButton() {
            if (!wishBtn) return;

            if (isWished) {
                wishBtn.className = "btn btn-danger rounded-pill px-3 py-2 shadow-sm d-flex align-items-center gap-2";

                wishBtn.innerHTML = `
                    <i class="bi bi-heart-fill fs-6 text-white"></i>
                    <span class="small text-white">Wished</span>
                `;
            } else {
                wishBtn.className = "btn btn-dark border-secondary rounded-pill px-3 py-2 shadow-sm d-flex align-items-center gap-2";

                wishBtn.innerHTML = `
                    <i class="bi bi-heart fs-6 text-white"></i>
                    <span class="small text-white">Wish</span>
                `;
            }
        }

        function initWishlist() {
            if (!wishBtn) return;

            wishBtn.addEventListener("click", async (e) => {
                e.preventDefault();

                if (!requireLogin()) return;

                const message = isWished
                    ? "위시리스트에서 삭제하시겠습니까?"
                    : "위시리스트에 추가하시겠습니까?";

                if (!confirm(message)) return;

                try {
                    await fetchHelper.put(`/api/wishlist/toggle?movie_id=${movieId}&movie_gbn=${movieGbn}`);

                    isWished = !isWished;
                    setWishButton();
                } catch (error) {
                    alert(error.message);
                    console.error(error);
                }
            });
        }

        // 리뷰 등록
        function initReviewTextarea() {
            if (!textarea || !counter) return;

            textarea.addEventListener("keyup", () => {
                limitText(textarea, counter);
            });
        }

        // 별 초기화
        function initStarRating() {
            if (!stars.length || !ratingInput) return;

            stars.forEach(star => {
                star.addEventListener("click", () => {
                    const value = star.dataset.value;
                    ratingInput.value = value;
                    paintStars(stars, value);
                });
            });
        }

        function initReviewForm() {
            if (!toggleFormBtn) return;

            toggleFormBtn.addEventListener("click", async (e) => {
                e.preventDefault();

                if (!requireLogin()) return;

                try {
                    const reviewId = await fetchHelper.get(`/api/movie/my?movie_id=${movieId}&movie_gbn=${movieGbn}`);

                    // 이미 작성한 리뷰가 있으면 수정폼 표시
                    if (reviewId > 0) {
                        if (confirm( "이미 리뷰를 작성하셨습니다. 수정하시겠습니까?")) {
                            showEditForm(reviewId);
                        }
                        return;
                    }

                    // 리뷰 없으면 작성폼 표시
                    hideReviewList();

                    const reviewForm = document.querySelector("#review-form");
                    if (reviewForm) {
                        reviewForm.style.display = "block";
                    }
                } catch (error) {
                    alert(error.message);
                }
            });

            if (!enrollForm) return;

            enrollForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                try {
                    regexHelper.value("#text_review", "내용을 입력하세요." );
                } catch (error) {
                    alert(error.message);
                    error.element.focus();
                    return;
                }

                const insertUrl = /*[[@{/api/movie/insert}]]*/ "";

                try {
                    await fetchHelper.post(insertUrl, new FormData(e.currentTarget));

                    location.reload();
                } catch (error) {
                    alert(error.message);
                    error.element.focus();
                }
            });
        }

        // 리뷰 수정
        function initEditButtons() {
            document.querySelectorAll(".edit-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const reviewId = btn.dataset.id;
                    showEditForm(reviewId);
                });
            });
        }

        function initEditTextareas() {
            document.querySelectorAll(".edit-textarea").forEach(textareaElement => {
                textareaElement.addEventListener("keyup", () => {
                    const counterElement =textareaElement.closest(".mb-2")?.querySelector(".edit-char-count");

                    limitText(textareaElement, counterElement);
                });
            });
        }

        function initEditStars() {
            document.querySelectorAll(".edit-star").forEach(star => {
                star.addEventListener("click", () => {
                    const reviewId = star.dataset.reviewId;
                    const value = star.dataset.value;

                    const hiddenInput = document.querySelector("#edit-rating-" + reviewId);

                    if (hiddenInput) {
                        hiddenInput.value = value;
                    }

                    const editStars = document.querySelectorAll('.edit-star[data-review-id="' + reviewId + '"]');

                    paintStars(editStars, value);
                });
            });
        }

        function initEditForms() {
            document.querySelectorAll(".review-edit-form").forEach(form => {
                form.addEventListener("submit", async (e) => {
                    e.preventDefault();

                    try {
                        await fetchHelper.put("/api/movie/update",new FormData(form));

                        alert("수정되었습니다.");
                        location.reload();
                    } catch (error) {
                        alert(error.message);
                    }
                });
            });
        }

        function initCancelButtons() {
            document.querySelectorAll(".cancel-edit").forEach(btn => {
                btn.addEventListener("click", () => {
                    btn.closest(".edit-form").style.display ="none";
                });
            });
        }

        //리뷰 삭제
        function initDeleteButtons() {
            document.querySelectorAll(".delete-btn").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const reviewId = btn.dataset.id;

                    if (!confirm("리뷰를 삭제하시겠습니까?")) {
                        return;
                    }

                    try {
                        await fetchHelper.put("/api/movie/del/" + reviewId);

                        alert("삭제되었습니다.");
                        location.reload();
                    } catch (error) {
                        alert(error.message);
                    }
                });
            });
        }
    </script>

</body>
</html>
